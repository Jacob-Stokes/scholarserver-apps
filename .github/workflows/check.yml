name: Application source and production builds

on:
  # Routine source checks run in the private Gitea build copy on Resolution.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install, lint, test, and build locked source
        run: sh scripts/check-source.sh
