name: Native multi-architecture images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/obsidian/api/**"
      - "apps/obsidian/mcp/**"
      - "apps/obsidian/sync/**"
      - "apps/obsidian/ui/**"
      - "apps/zotero/controller/**"
      - "apps/zotero/automations/**"
      - "apps/zotero/desktop/**"
      - "apps/zotero/mcp/**"
      - "apps/zotero/ui/**"
      - "apps/docling/controller/**"
      - "apps/docling/ui/**"
      - "packages/mcp-common/**"
      - "vendor/scholarserver-ui/**"
      - "scripts/build-native-images.sh"
      - ".github/workflows/images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native images
        env:
          REGISTRY: ghcr.io/jacob-stokes
          ARCH: ${{ matrix.architecture }}
          REVISION: ${{ github.sha }}
        run: ./scripts/build-native-images.sh

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [obsidian-sync, obsidian-api, obsidian-mcp, zotero-desktop, zotero-controller, zotero-automations, zotero-mcp, docling-app]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        env:
          IMAGE: ghcr.io/jacob-stokes/scholarserver-${{ matrix.image }}
          REVISION: ${{ github.sha }}
        run: |
          publish_manifest() {
            target="$1"
            for attempt in 1 2 3; do
              docker manifest rm "$target" 2>/dev/null || true
              if docker manifest create "$target" "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64" \
                && docker manifest push "$target"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          publish_manifest "$IMAGE:sha-$REVISION"
          publish_manifest "$IMAGE:edge"
