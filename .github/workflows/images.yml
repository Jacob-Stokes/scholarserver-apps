name: Native multi-architecture images

on:
  # Image publication is opt-in. These standard public-repository runners are free.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked source-verification dependencies
        run: npm ci --ignore-scripts
      - name: Install image-layer decoder
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build native images without publishing
        env:
          REGISTRY: ghcr.io/jacob-stokes
          ARCH: ${{ matrix.architecture }}
          REVISION: ${{ github.sha }}
        run: ./scripts/build-native-images.sh
      - name: Run the named native qualification gates
        env:
          REGISTRY: ghcr.io/jacob-stokes
          ARCH: ${{ matrix.architecture }}
          REVISION: ${{ github.sha }}
          NATIVE_IMAGE_TEST_USE_SUDO: '1'
        run: ./scripts/test-native-images.sh
      - name: Prepare isolated locked Playwright and native Chromium
        run: |
          browser_root=$(mktemp -d "$RUNNER_TEMP/scholarserver-browser.XXXXXX")
          # Pin both Playwright and its exact playwright-core dependency in a temp lock.
          npm install --prefix "$browser_root" --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund playwright@1.58.2
          npm ci --prefix "$browser_root" --ignore-scripts --no-audit --no-fund
          export PLAYWRIGHT_BROWSERS_PATH="$browser_root/browsers"
          node "$browser_root/node_modules/playwright/cli.js" install --with-deps chromium
          browser_executable=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$browser_root/node_modules/playwright")
          echo "SCHOLARSERVER_BROWSER_MODULES=$browser_root/node_modules" >> "$GITHUB_ENV"
          echo "SCHOLARSERVER_BROWSER_EXECUTABLE=$browser_executable" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
      - name: Qualify Docling, Logseq and Zotero development images
        timeout-minutes: 30
        env:
          REGISTRY: ghcr.io/jacob-stokes
          ARCH: ${{ matrix.architecture }}
          REVISION: ${{ github.sha }}
        run: ./scripts/qualify-development-apps.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact images that passed the native gates
        env:
          REGISTRY: ghcr.io/jacob-stokes
          ARCH: ${{ matrix.architecture }}
          REVISION: ${{ github.sha }}
        run: ./scripts/publish-native-images.sh
      - name: Retain native build and qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-image-receipts-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            .dev/native-images/${{ github.sha }}-${{ matrix.architecture }}.json
            .dev/native-images/${{ github.sha }}-${{ matrix.architecture }}.qualified.json
            .dev/native-images/${{ github.sha }}-${{ matrix.architecture }}.development.*/summary.json
            .dev/native-images/${{ github.sha }}-${{ matrix.architecture }}.development.*/logseq-native.json
            .dev/native-images/${{ github.sha }}-${{ matrix.architecture }}.development.*/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [files, n8n, n8n-app, logseq-helper, logseq-mcp, logseq-sync, obsidian-sync, obsidian-api, obsidian-mcp, zotero-desktop, zotero-controller, zotero-local-api-bridge, zotero-automations, zotero-mcp, docling-app, freshrss-reader, freshrss-app]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        env:
          IMAGE: ghcr.io/jacob-stokes/scholarserver-${{ matrix.image }}
          REVISION: ${{ github.sha }}
        run: |
          work_directory=$(mktemp -d)
          trap 'rm -rf -- "$work_directory"' EXIT HUP INT TERM

          manifest_is_missing() {
            grep -Eiq 'manifest unknown|no such manifest|name unknown|manifest[^:]*:.*not found' "$1"
          }

          manifest_matches_sources() {
            target="$1"
            source_suffix="$2"
            docker manifest inspect --verbose "$IMAGE:sha-$REVISION$source_suffix-amd64" > "$work_directory/amd64.json"
            docker manifest inspect --verbose "$IMAGE:sha-$REVISION$source_suffix-arm64" > "$work_directory/arm64.json"
            docker manifest inspect --verbose "$target" > "$work_directory/target.json"
            node scripts/native-image-receipt.mjs compare-manifest \
              --existing "$work_directory/target.json" \
              --source "$work_directory/amd64.json" \
              --source "$work_directory/arm64.json"
          }

          publish_manifest() {
            target="$1"
            source_suffix="${2:-}"
            mutable="${3:-false}"

            if [ "$mutable" = false ]; then
              if docker manifest inspect --verbose "$target" > "$work_directory/existing.json" 2> "$work_directory/existing.err"; then
                manifest_matches_sources "$target" "$source_suffix"
                echo "Immutable manifest already contains the verified native images; skipping: $target"
                return 0
              fi
              if ! manifest_is_missing "$work_directory/existing.err"; then
                cat "$work_directory/existing.err" >&2
                return 1
              fi
            fi

            for attempt in 1 2 3; do
              docker manifest rm "$target" 2>/dev/null || true
              if docker manifest create "$target" "$IMAGE:sha-$REVISION$source_suffix-amd64" "$IMAGE:sha-$REVISION$source_suffix-arm64" \
                && docker manifest push "$target" \
                && manifest_matches_sources "$target" "$source_suffix"; then
                  return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }
          publish_manifest "$IMAGE:sha-$REVISION"
          # Manual candidate builds must not move the shared development tag.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            publish_manifest "$IMAGE:edge" "" true
          fi
          if [ "$IMAGE" = "ghcr.io/jacob-stokes/scholarserver-obsidian-sync" ]; then
            publish_manifest "$IMAGE:sha-$REVISION-livesync-couchdb" "-livesync-couchdb"
            publish_manifest "$IMAGE:sha-$REVISION-livesync-worker" "-livesync-worker"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              publish_manifest "$IMAGE:edge-livesync-couchdb" "-livesync-couchdb" true
              publish_manifest "$IMAGE:edge-livesync-worker" "-livesync-worker" true
            fi
          fi
