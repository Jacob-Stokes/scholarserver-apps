services:
  n8n:
    image: ghcr.io/jacob-stokes/scholarserver-n8n@sha256:4076ee8130e3cc0bf480cfcdb10c53ce1d8e58cacbd980d658976474c8249d32
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777"]
    volumes:
      - ${SCHOLARSERVER_DATA_STATE}:/home/node/.n8n
      - ${SCHOLARSERVER_DATA_CACHE}:/home/node/.cache
    expose: ["5678"]
    networks: [instance, egress]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
  integration:
    image: ghcr.io/jacob-stokes/scholarserver-n8n-app@sha256:ce82c53f9cbd7aa839d9fd1dbf1dd7c4d41474aab8aea5308e22c73584f591d7
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 64
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
    expose: ["8080"]
    networks: [instance, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
