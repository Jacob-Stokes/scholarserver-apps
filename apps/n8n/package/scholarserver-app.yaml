schemaVersion: 1
id: org.scholarserver.n8n
name: n8n (Beta)
packageVersion: 0.1.0-guided.20260912.1
compatibility: { platform: ">=0.1.0", schema: 1 }
upstream: { name: n8n, version: 2.38.1, license: Sustainable-Use-License }
support: { tier: official, architectures: [amd64] }
delivery: { class: headless-service, management: managed }
tenancy: { mode: per-workspace }
capabilities:
  provides: [automations.workflows]
  requires: []
  conflicts: []
resources:
  minimum: { cpu: 0.5, memory: 1GiB, disk: 2GiB }
  recommended: { cpu: 1, memory: 2GiB, disk: 5GiB }
permissions:
  networkEgress: [workflow-destinations]
  hostMounts: []
  devices: []
  applicationActions:
    - packageId: org.scholarserver.zotero
      actionIds: [research-items, match-attachment, attach-docling-result]
    - packageId: org.scholarserver.obsidian
      actionIds: [create-research-note]
    - packageId: org.scholarserver.docling
      actionIds: [discover, enqueue, job-status]
hardening: { readOnlyRoot: true, noNewPrivileges: true, dropCapabilities: [ALL] }
images:
  - service: n8n
    reference: ghcr.io/jacob-stokes/scholarserver-n8n@sha256:48c4e461b86201a3b18d5d35dcf5ba9e6250e76fa697df1482871efcb413d68d
  - service: integration
    reference: ghcr.io/jacob-stokes/scholarserver-n8n-app@sha256:95e321f56b33a8dc0d8741f13acfa2d90cf3e10be5ee106e7282aa2922ca32fd
data:
  - id: state
    mountPath: /home/node/.n8n
    owner: n8n
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: cache
    mountPath: /home/node/.cache
    owner: n8n
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: reproducible
    retention: preserve
  - id: runtime
    mountPath: /runtime
    owner: n8n
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
endpoints:
  - id: app-ui
    service: integration
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: editor
    service: n8n
    port: 5678
    protocol: http
    exposure: human-optional
    auth: none-private
    launchLabel: Open n8n
    remoteAccess:
      routing: origin
      private: true
      public: false
      authentik: unsupported
      defaultAuthentik: false
ui: { mode: standalone, endpoint: app-ui, defaultPath: / }
presentation:
  details:
    tags: [Automation]
  icon:
    path: assets/icons/n8n.webp
    mediaType: image/webp
    attribution:
      name: selfh.st/icons
      url: https://selfh.st/icons/
      license: CC-BY-4.0
      licenseUrl: https://github.com/selfhst/icons/blob/main/LICENSE
lifecycle: { supportsDisable: true, removeDataDefault: false, rollback: backup-required }
onboarding:
  readyWhen: compose-health
  checklist:
    - Set your n8n password in ScholarServer to finish installation
    - Keep workflow credentials in n8n, not in workflow parameters
    - Back up the complete application data, including its encryption key
  actions:
    - id: setup
      data: runtime
      timeoutSeconds: 90
      provisionServiceAccess: true
      fields:
        - { id: password, type: string, secret: true, required: true }
        - { id: email, type: string, secret: false, required: false }
        - { id: mfaCode, type: string, secret: true, required: false }
