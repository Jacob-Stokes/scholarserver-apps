schemaVersion: 1
id: zotero-pdf-markdown
version: 3
name: Automatically convert new Zotero PDFs
description: Check the shared Zotero–Docling folder every minute and attach converted Markdown to the matching paper. Existing PDFs are also checked when enabled; completed results are reused. Choose a folder with fewer than 100 PDFs. OCR is off; unmatched files are skipped.
research: convert-pdfs
presentation:
  tags: [PDFs, Conversion]
  summary: "Watch a shared folder for Zotero PDFs and attach Markdown automatically. Checks every minute by default; OCR is off."
  maturity: preview
  effects: "Converts matching PDFs and attaches Markdown; existing results are reused."
  ai: none
requirements:
  - binding: zotero
    packageId: org.scholarserver.zotero
    name: Zotero
    role: "Match papers and attach results"
    actions: [match-attachment, attach-docling-result]
  - binding: docling
    packageId: org.scholarserver.docling
    name: Docling
    role: "Convert PDFs"
    actions: [discover, enqueue, job-status]
configuration:
  scheduleNode: schedule
workflow:
  nodes:
    - id: find-stage
      name: Find new PDFs
      type: n8n-nodes-base.stickyNote
      typeVersion: 1
      position: [-80, -220]
      parameters:
        content: "## 1 · Find new PDFs\nCheck the selected folder every minute by default. Process PDFs one at a time; skip files without exactly one matching Zotero attachment."
        width: 1360
        height: 600
        color: 4
    - id: convert-stage
      name: Convert with Docling
      type: n8n-nodes-base.stickyNote
      typeVersion: 1
      position: [1340, -220]
      parameters:
        content: "## 2 · Convert with Docling\nReuse completed results, or start a conversion and check its status. OCR is off."
        width: 760
        height: 600
        color: 5
    - id: save-stage
      name: Save to Zotero
      type: n8n-nodes-base.stickyNote
      typeVersion: 1
      position: [2160, -220]
      parameters:
        content: "## 3 · Save to Zotero\nAttach Markdown to the original paper, then continue to the next PDF. Existing attachments are reused."
        width: 460
        height: 600
        color: 4
    - id: waiting-stage
      name: Waiting and failure handling
      type: n8n-nodes-base.stickyNote
      typeVersion: 1
      position: [1340, 430]
      parameters:
        content: "## While conversion is running\nWait one minute between checks. Stop this run if conversion fails or exceeds one hour. Each app request has up to three attempts, three seconds apart."
        width: 1280
        height: 480
        color: 2
    - id: manual
      name: Run now
      type: n8n-nodes-base.manualTrigger
      typeVersion: 1
      position: [0, 180]
      parameters: {}
    - id: schedule
      name: Check for new PDFs
      type: n8n-nodes-base.scheduleTrigger
      typeVersion: 1.2
      position: [0, 0]
      parameters:
        rule:
          interval:
            - {field: minutes, minutesInterval: 1}
    - id: discover
      name: Find shared PDFs
      type: n8n-nodes-base.httpRequest
      typeVersion: 4.2
      retryOnFail: true
      maxTries: 3
      waitBetweenTries: 3000
      position: [220, 0]
      parameters:
        method: POST
        url: http://integration:8081/research/discover
        authentication: genericCredentialType
        genericAuthType: httpHeaderAuth
        sendBody: true
        specifyBody: json
        jsonBody: '{}'
        options: {timeout: 120000, redirect: {redirect: {followRedirects: false}}}
    - id: files
      name: One item per PDF
      type: n8n-nodes-base.splitOut
      typeVersion: 1
      position: [440, 0]
      parameters: {fieldToSplitOut: files, options: {}}
    - id: loop
      name: One conversion at a time
      type: n8n-nodes-base.splitInBatches
      typeVersion: 3
      position: [660, 0]
      parameters: {batchSize: 1, options: {}}
    - id: match
      name: Match Zotero attachment
      type: n8n-nodes-base.httpRequest
      typeVersion: 4.2
      retryOnFail: true
      maxTries: 3
      waitBetweenTries: 3000
      position: [880, 100]
      parameters:
        method: POST
        url: http://integration:8081/research/match
        authentication: genericCredentialType
        genericAuthType: httpHeaderAuth
        sendBody: true
        specifyBody: json
        jsonBody: '={{ { sourcePath: $json.path } }}'
        options: {timeout: 120000, redirect: {redirect: {followRedirects: false}}}
    - id: matched
      name: Matched exactly one attachment?
      type: n8n-nodes-base.if
      typeVersion: 2.2
      position: [1100, 100]
      parameters:
        conditions:
          options: {caseSensitive: true, leftValue: '', typeValidation: strict, version: 2}
          conditions:
            - {id: matched, leftValue: '={{ $json.state }}', rightValue: matched, operator: {type: string, operation: equals}}
          combinator: and
        options: {}
    - id: enqueue
      name: Queue Docling conversion
      type: n8n-nodes-base.httpRequest
      typeVersion: 4.2
      # Docling reuses its source-hash/profile job rather than creating duplicates.
      retryOnFail: true
      maxTries: 3
      waitBetweenTries: 3000
      position: [1420, 0]
      parameters:
        method: POST
        url: http://integration:8081/research/enqueue
        authentication: genericCredentialType
        genericAuthType: httpHeaderAuth
        sendBody: true
        specifyBody: json
        jsonBody: '={{ { sourcePath: $json.sourcePath } }}'
        options: {timeout: 120000, redirect: {redirect: {followRedirects: false}}}
    - id: wait
      name: Wait before checking conversion
      type: n8n-nodes-base.wait
      typeVersion: 1.1
      position: [1480, 700]
      parameters: {resume: timeInterval, amount: 1, unit: minutes}
    - id: job
      name: Check conversion status
      type: n8n-nodes-base.httpRequest
      typeVersion: 4.2
      retryOnFail: true
      maxTries: 3
      waitBetweenTries: 3000
      position: [1640, 0]
      parameters:
        method: POST
        url: http://integration:8081/research/job
        authentication: genericCredentialType
        genericAuthType: httpHeaderAuth
        sendBody: true
        specifyBody: json
        jsonBody: '={{ { jobId: $json.id } }}'
        options: {timeout: 120000, redirect: {redirect: {followRedirects: false}}}
    - id: success
      name: Conversion succeeded?
      type: n8n-nodes-base.if
      typeVersion: 2.2
      position: [1880, 0]
      parameters:
        conditions:
          options: {caseSensitive: true, leftValue: '', typeValidation: strict, version: 2}
          conditions:
            - {id: succeeded, leftValue: '={{ $json.state }}', rightValue: succeeded, operator: {type: string, operation: equals}}
          combinator: and
        options: {}
    - id: failed
      name: Conversion failed or timed out?
      type: n8n-nodes-base.if
      typeVersion: 2.2
      position: [1880, 650]
      parameters:
        conditions:
          options: {caseSensitive: true, leftValue: '', typeValidation: strict, version: 2}
          conditions:
            - {id: failed, leftValue: '={{ $json.state === "failed" || Date.now() - Date.parse($json.createdAt) > 3600000 }}', rightValue: true, operator: {type: boolean, operation: 'true', singleValue: true}}
          combinator: and
        options: {}
    - id: stop
      name: Report conversion failure
      type: n8n-nodes-base.stopAndError
      typeVersion: 1
      position: [2300, 650]
      parameters: {errorMessage: 'The conversion failed or exceeded one hour. Check Docling before retrying.'}
    - id: attach
      name: Attach Markdown to original paper
      type: n8n-nodes-base.httpRequest
      typeVersion: 4.2
      # Zotero serializes attachment imports and reuses the source-hash receipt.
      retryOnFail: true
      maxTries: 3
      waitBetweenTries: 3000
      position: [2300, 0]
      parameters:
        method: POST
        url: http://integration:8081/research/attach
        authentication: genericCredentialType
        genericAuthType: httpHeaderAuth
        sendBody: true
        specifyBody: json
        jsonBody: '={{ { jobId: $json.id } }}'
        options: {timeout: 120000, redirect: {redirect: {followRedirects: false}}}
  connections:
    Run now:
      main: [[{node: Find shared PDFs, type: main, index: 0}]]
    Check for new PDFs:
      main: [[{node: Find shared PDFs, type: main, index: 0}]]
    Find shared PDFs:
      main: [[{node: One item per PDF, type: main, index: 0}]]
    One item per PDF:
      main: [[{node: One conversion at a time, type: main, index: 0}]]
    One conversion at a time:
      main: [[], [{node: Match Zotero attachment, type: main, index: 0}]]
    Match Zotero attachment:
      main: [[{node: 'Matched exactly one attachment?', type: main, index: 0}]]
    'Matched exactly one attachment?':
      main: [[{node: Queue Docling conversion, type: main, index: 0}], [{node: One conversion at a time, type: main, index: 0}]]
    Queue Docling conversion:
      main: [[{node: Check conversion status, type: main, index: 0}]]
    Wait before checking conversion:
      main: [[{node: Check conversion status, type: main, index: 0}]]
    Check conversion status:
      main: [[{node: 'Conversion succeeded?', type: main, index: 0}]]
    'Conversion succeeded?':
      main: [[{node: Attach Markdown to original paper, type: main, index: 0}], [{node: 'Conversion failed or timed out?', type: main, index: 0}]]
    'Conversion failed or timed out?':
      main: [[{node: Report conversion failure, type: main, index: 0}], [{node: Wait before checking conversion, type: main, index: 0}]]
    Attach Markdown to original paper:
      main: [[{node: One conversion at a time, type: main, index: 0}]]
  settings: {executionOrder: v1, executionTimeout: 7200, saveDataSuccessExecution: none, saveDataErrorExecution: none}
