schemaVersion: 1
id: org.scholarserver.obsidian
name: Obsidian
packageVersion: 0.6.0-multivault.20260930.1
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Obsidian Headless + Self-hosted LiveSync
  version: 0.0.14 / 1.0.21
  license: Mixed (UNLICENSED / MIT)
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: headless-service
  management: managed
tenancy:
  mode: per-workspace
  maxInstancesPerWorkspace: 1
capabilities:
  provides: [notes.vault, notes.sync, mcp.obsidian]
  requires: [gateway.mcp]
  conflicts: []
resources:
  minimum: { cpu: 0.75, memory: 768MiB, disk: 1GiB }
  recommended: { cpu: 1, memory: 1536MiB, disk: 10GiB }
permissions:
  networkEgress: [sync-obsidian-net]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: sync
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:bb1bd5a90068bde583e13a18acc070d3495e59132cfbe611d8e2722b7edbeeef
  - service: api
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:7d383fbbe5b3db3d443f0956d80d042e1af349a4daf1e46600ce6e0602d4ca7d
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:04097da36e1baf86ea21a5dd23549d27d3aeddaad7f9f64b410abe24c850a60a
  - service: livesync-couchdb
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:458854857c98097a02652e6c5d8293a206e2471b7e5f7c9f0e36dfb139a037ef
  - service: livesync-worker
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:e8234c3c8a6126b3900ae4d6e76596a5e430825bc5f4db6ddcc4c2ffec3fa879
data:
  - id: official-client
    mountPath: /official-client
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: excluded
    retention: preserve
  - id: vault
    mountPath: /vault
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: Obsidian vault
  - id: vaults
    mountPath: /vaults
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: Obsidian vaults
  - id: headless-config
    mountPath: /home/obsidian/.config
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: runtime
    mountPath: /runtime
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-db
    mountPath: /livesync-db
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-runtime
    mountPath: /livesync-runtime
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0755" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-couchdb
    mountPath: /opt/couchdb/data
    owner: couchdb
    filesystem: { uid: 5984, gid: 5984, mode: "0700" }
    backup: application-consistent
    retention: preserve
endpoints:
  - { id: vault-api, service: api, port: 3000, protocol: http, exposure: private, auth: service-identity }
  - id: app-ui
    service: sync
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: mcp
    service: mcp
    port: 7002
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Obsidian
      namespace: obsidian
      hostname: obsidian-mcp
      credentialData: runtime
      credentialFile: service-token
  - id: livesync-couchdb
    service: livesync-couchdb
    port: 5984
    protocol: http
    exposure: human-optional
    auth: none-private
    remoteAccess:
      routing: origin
      private: true
      public: false
      authentik: unsupported
      defaultAuthentik: false
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /overview
  configurationPath: /configuration
  configuration:
    version: 1
    sections:
      - { id: vaults, title: Vaults }
      - { id: setup, title: Vault connection }
      - { id: access, title: Vault settings }
presentation:
  editorialIcon:
    path: assets/icons/obsidian-editorial.png
    mediaType: image/png
    attribution:
      name: ScholarServer editorial marks
      url: https://github.com/Jacob-Stokes/scholarserver-apps
      license: CC-BY-4.0
      licenseUrl: https://creativecommons.org/licenses/by/4.0/
  details:
    description: Connect Markdown vaults using Obsidian Sync or Self-hosted LiveSync.
    tags: [Notes]
    links:
      - { label: Obsidian terms, kind: website, url: https://obsidian.md/terms }
  icon:
    path: assets/icons/obsidian.webp
    mediaType: image/webp
    attribution:
      name: selfh.st/icons
      url: https://selfh.st/icons/
      license: CC-BY-4.0
      licenseUrl: https://github.com/selfhst/icons/blob/main/LICENSE
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  # Existing roots and the excluded client cache remain at their original paths.
  # Consolidating older installations requires the checkpointed migration gate.
  rollback: reversible
onboarding:
  readyWhen: compose-health
  checklist:
    - Add each vault in Configuration and finish its connection
    - Use a paid Obsidian Sync account or the Self-hosted LiveSync plugin
    - Keep other sync methods off for each LiveSync vault
    - Choose each vault's AI-accessible folder
  actions:
    - id: browse-folders
      data: runtime
      timeoutSeconds: 30
      requireInstanceApproval: true
      fields:
        - { id: vaultId, type: string, secret: false, required: true }
        - { id: path, type: string, secret: false, required: false }
    - id: create-research-note
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: vaultId, type: string, secret: false, required: true }
        - { id: folder, type: string, secret: false, required: true }
        - { id: filename, type: string, secret: false, required: true }
        - { id: content, type: string, secret: true, required: true }
    - id: status
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: vaultId, type: string, secret: false, required: true }
