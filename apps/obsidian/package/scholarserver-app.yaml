schemaVersion: 1
id: org.scholarserver.obsidian
name: Obsidian
packageVersion: 0.6.0-vault-ui.20261001.2
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Obsidian Headless + Self-hosted LiveSync
  version: 0.0.14 / 1.0.21
  license: Mixed (UNLICENSED / MIT)
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: headless-service
  management: managed
tenancy:
  mode: per-workspace
  maxInstancesPerWorkspace: 1
capabilities:
  provides: [notes.vault, notes.sync, mcp.obsidian]
  requires: [gateway.mcp]
  conflicts: []
resources:
  minimum: { cpu: 0.75, memory: 768MiB, disk: 1GiB }
  recommended: { cpu: 1, memory: 1536MiB, disk: 10GiB }
permissions:
  networkEgress: [sync-obsidian-net]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: sync
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:0230a479af0e782871e2b35be64fa9e168e7b1a0c5ce9d7d86972270abb1c537
  - service: api
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:ee8887c7c14cd9f5d8860ebde643a487014486f3130e5046593857dc1b85f7d6
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:76510fb7024567e3faa012d6b3bb1ba2fedee16091c7a15c26eddfef3f925e4b
  - service: livesync-couchdb
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:49cb9ad1ca165133f6ed55cf221f13f3e530ca47c94fe8b8f9cd4830ec639db6
  - service: livesync-worker
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:27b9ed38adf52be5874786d6bf7d966c02168d933be073dd506be744d8aacb99
data:
  - id: official-client
    mountPath: /official-client
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: excluded
    retention: preserve
  - id: vault
    mountPath: /vault
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: Obsidian vault
  - id: vaults
    mountPath: /vaults
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: Obsidian vaults
  - id: headless-config
    mountPath: /home/obsidian/.config
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: runtime
    mountPath: /runtime
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-db
    mountPath: /livesync-db
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-runtime
    mountPath: /livesync-runtime
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0755" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-couchdb
    mountPath: /opt/couchdb/data
    owner: couchdb
    filesystem: { uid: 5984, gid: 5984, mode: "0700" }
    backup: application-consistent
    retention: preserve
endpoints:
  - { id: vault-api, service: api, port: 3000, protocol: http, exposure: private, auth: service-identity }
  - id: app-ui
    service: sync
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: mcp
    service: mcp
    port: 7002
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Obsidian
      namespace: obsidian
      hostname: obsidian-mcp
      credentialData: runtime
      credentialFile: service-token
  - id: livesync-couchdb
    service: livesync-couchdb
    port: 5984
    protocol: http
    exposure: human-optional
    auth: none-private
    remoteAccess:
      routing: origin
      private: true
      public: false
      authentik: unsupported
      defaultAuthentik: false
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /overview
  configurationPath: /configuration
  configuration:
    version: 1
    sections:
      - { id: vaults, title: Vaults }
presentation:
  editorialIcon:
    path: assets/icons/obsidian-editorial.png
    mediaType: image/png
    attribution:
      name: ScholarServer editorial marks
      url: https://github.com/Jacob-Stokes/scholarserver-apps
      license: CC-BY-4.0
      licenseUrl: https://creativecommons.org/licenses/by/4.0/
  details:
    description: Connect Markdown vaults using Obsidian Sync or Self-hosted LiveSync.
    tags: [Notes]
    links:
      - { label: Obsidian terms, kind: website, url: https://obsidian.md/terms }
  icon:
    path: assets/icons/obsidian.webp
    mediaType: image/webp
    attribution:
      name: selfh.st/icons
      url: https://selfh.st/icons/
      license: CC-BY-4.0
      licenseUrl: https://github.com/selfhst/icons/blob/main/LICENSE
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  # The executor snapshots and journals legacy data before activating the registry.
  # The excluded client cache stays excluded and receives a local recovery copy.
  rollback: backup-required
onboarding:
  readyWhen: compose-health
  checklist:
    - Add each vault in Configuration and finish its connection
    - Use a paid Obsidian Sync account or the Self-hosted LiveSync plugin
    - Keep other sync methods off for each LiveSync vault
    - Choose each vault's AI-accessible folder
  actions:
    - id: browse-folders
      data: runtime
      timeoutSeconds: 30
      requireInstanceApproval: true
      fields:
        - { id: vaultId, type: string, secret: false, required: true }
        - { id: path, type: string, secret: false, required: false }
    - id: create-research-note
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: vaultId, type: string, secret: false, required: true }
        - { id: folder, type: string, secret: false, required: true }
        - { id: filename, type: string, secret: false, required: true }
        - { id: content, type: string, secret: true, required: true }
    - id: status
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: vaultId, type: string, secret: false, required: true }
