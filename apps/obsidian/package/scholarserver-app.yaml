schemaVersion: 1
id: org.scholarserver.obsidian
name: Obsidian
packageVersion: 0.5.0-beta.3
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Obsidian Headless + Self-hosted LiveSync
  version: 0.0.14 / 1.0.21
  license: Mixed (UNLICENSED / MIT)
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: headless-service
  management: managed
tenancy:
  mode: per-workspace
capabilities:
  provides: [notes.vault, notes.sync, mcp.obsidian]
  requires: [gateway.mcp]
  conflicts: []
variants:
  - id: self-hosted-livesync
    name: Self-hosted LiveSync
    description: Sync your vault through ScholarServer using the free Self-hosted LiveSync plugin.
    recommended: true
    services: [sync, api, mcp, livesync-couchdb, livesync-worker]
    data: [vault, headless-config, runtime, official-client, livesync-db, livesync-runtime, livesync-couchdb]
    resources:
      minimum: { cpu: 0.75, memory: 768MiB, disk: 1GiB }
      recommended: { cpu: 1, memory: 1536MiB, disk: 10GiB }
    highlights:
      - No Obsidian Sync subscription required
      - Keeps an always-available server copy of the vault
      - Works privately through Tailscale or through public HTTPS
    limitations:
      - Requires the Self-hosted LiveSync plugin on each Obsidian device
      - Other vault sync methods must remain turned off
  - id: obsidian-sync
    name: Obsidian Sync
    description: Use your existing paid Obsidian Sync account to keep the ScholarServer copy up to date.
    recommended: false
    services: [sync, api, mcp]
    data: [vault, headless-config, runtime, official-client, livesync-runtime]
    resources:
      minimum: { cpu: 0.5, memory: 512MiB, disk: 1GiB }
      recommended: { cpu: 0.75, memory: 1GiB, disk: 10GiB }
    highlights:
      - Uses Obsidian's official sync service
      - No community plugin or separate sync database
      - Keeps the same server-side notes and AI tools
    limitations:
      - Requires a paid Obsidian Sync account
      - Downloads the official client only after your confirmation; Obsidian terms apply
resources:
  minimum: { cpu: 0.75, memory: 768MiB, disk: 1GiB }
  recommended: { cpu: 1, memory: 1536MiB, disk: 10GiB }
permissions:
  networkEgress: [sync-obsidian-net]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: sync
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:1d19d5a19766045e88b122a1aa648e77e5c8769ad5720a4323fa30ff304a006c
  - service: api
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:5e37b53e1d57057959c545dacefbe6fa78f925be5fe50139fa6a683e12be29b2
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:4ca243536106a014f9cb8b35a1159535dea90eae9e42018812a59b9dcef5f1f5
  - service: livesync-couchdb
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:579417d3217c7d9d931d09a0385d78b02727154e0ac2fc86a9e6186639acd73d
  - service: livesync-worker
    reference: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:895e52c4e26e51936a7e2983a637b92b96c5a92b2a814e50f3f61c3fec674e19
data:
  - id: official-client
    mountPath: /official-client
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: excluded
    retention: preserve
  - id: vault
    mountPath: /vault
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: Obsidian vault
  - id: headless-config
    mountPath: /home/obsidian/.config
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: runtime
    mountPath: /runtime
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: reproducible
    retention: preserve
  - id: livesync-db
    mountPath: /livesync-db
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: livesync-runtime
    mountPath: /livesync-runtime
    owner: obsidian
    filesystem: { uid: 1000, gid: 1000, mode: "0755" }
    backup: reproducible
    retention: preserve
  - id: livesync-couchdb
    mountPath: /opt/couchdb/data
    owner: couchdb
    filesystem: { uid: 5984, gid: 5984, mode: "0700" }
    backup: application-consistent
    retention: preserve
endpoints:
  - { id: vault-api, service: api, port: 3000, protocol: http, exposure: private, auth: service-identity }
  - id: app-ui
    service: sync
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: mcp
    service: mcp
    port: 7002
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Obsidian
      namespace: obsidian
      hostname: obsidian-mcp
      credentialData: runtime
      credentialFile: service-token
  - { id: livesync-couchdb, service: livesync-couchdb, port: 5984, protocol: http, exposure: private, auth: none-private }
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /overview
presentation:
  details:
    tags: [Notes, Vaults, Sync]
  icon:
    path: assets/icons/obsidian.webp
    mediaType: image/webp
    attribution:
      name: selfh.st/icons
      url: https://selfh.st/icons/
      license: CC-BY-4.0
      licenseUrl: https://github.com/selfhst/icons/blob/main/LICENSE
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  # Vault/enrollment formats remain unchanged. A restored official installation
  # asks before downloading its client again.
  rollback: reversible
onboarding:
  readyWhen: compose-health
  checklist:
    - Connect the selected sync method
    - Choose private Tailscale or public HTTPS for Self-hosted LiveSync
    - Keep other vault sync methods turned off when using LiveSync
    - Choose the folder exposed through MCP
  actions:
    - id: install-client
      data: runtime
      timeoutSeconds: 10
      fields:
        - { id: confirmed, type: boolean, secret: false, required: true }
    - id: status
      data: runtime
      timeoutSeconds: 10
      fields: []
    - id: select-profile
      data: runtime
      timeoutSeconds: 10
      fields:
        - { id: profile, type: string, secret: false, required: true }
    - id: login
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: email, type: string, secret: false, required: true }
        - { id: password, type: string, secret: true, required: true }
        - { id: mfa, type: string, secret: true, required: false }
    - id: connect-vault
      data: runtime
      timeoutSeconds: 900
      activateGateway: true
      fields:
        - { id: vault, type: string, secret: false, required: true }
        - { id: encryptionPassword, type: string, secret: true, required: false }
        - { id: scopePath, type: string, secret: false, required: true }
    - id: configure-livesync
      data: runtime
      timeoutSeconds: 180
      activateGateway: true
      fields:
        - { id: accessMethod, type: string, secret: false, required: true }
        - { id: connectionUrl, type: string, secret: false, required: true }
        - { id: vaultPassphrase, type: string, secret: true, required: true }
        - { id: scopePath, type: string, secret: false, required: true }
        - { id: confirmedNoOtherSync, type: boolean, secret: false, required: true }
    - id: complete-livesync
      data: runtime
      timeoutSeconds: 10
      fields:
        - { id: confirmedPluginConnected, type: boolean, secret: false, required: true }
