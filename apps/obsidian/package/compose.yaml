services:
  sync:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:eb1408f13fbb09185b8e58df8b6efb7b11030a64640940dfa021018b104233eb
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_HEADLESS_CONFIG}:/home/obsidian/.config
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_OFFICIAL_CLIENT}:/official-client
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  api:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:6a66315f92529a13e9abcd87a2e14960ba2bdc5f6b16bdf2117054a1ac129f8d
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["3000"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:73c593708e2ce46e58f0e0c7c6537863da9b25bcffb082630d1c2a721b1537f0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["7002"]
    networks:
      instance:
        aliases: [obsidian-mcp]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7002/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  livesync-couchdb:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:ff63b220d37c4b22cd57fc29dee84d873c83151f2e3516a894a72baf5b714fab
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
      - "/opt/couchdb/etc/local.d:rw,noexec,nosuid,nodev,size=4m,uid=5984,gid=5984,mode=0700"
    volumes:
      - ${SCHOLARSERVER_DATA_LIVESYNC_COUCHDB}:/opt/couchdb/data
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime:ro
    expose: ["5984"]
    networks:
      instance:
        aliases: [livesync-couchdb]
      edge:
        aliases: [obsidian-livesync]
    healthcheck:
      test: [CMD, /usr/local/bin/scholarserver-couchdb-healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18
  livesync-worker:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:0fbea3fda311380b5f78bc8af756c1f961f87ae68c72ab045774c826a1f819a5
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_LIVESYNC_DB}:/livesync-db
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8081"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
