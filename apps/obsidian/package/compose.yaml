services:
  sync:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:c1d28c8fa427e65e1648a318027226637b5d88173d1ba7ae679d1097623f0870
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
      SCHOLARSERVER_WORKSPACE_ID: ${SCHOLARSERVER_WORKSPACE_ID}
      SCHOLARSERVER_INSTANCE_ID: ${SCHOLARSERVER_INSTANCE_ID}
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_HEADLESS_CONFIG}:/home/obsidian/.config
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_OFFICIAL_CLIENT}:/official-client
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  api:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:09ef94121f7bead9c87018e3527b87b1f6a1c775dce61d1c093fba637afa299e
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["3000"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:83717170f355340a79b644acd90de7cb34ef747caf85cb79a9943f4985a1a5e7
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["7002"]
    networks:
      instance:
        aliases: [obsidian-mcp]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7002/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  livesync-couchdb:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:b33c10728ab970734af7116d7219ec862400a7595e4bc1cfe360bff762d182f8
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
      - "/opt/couchdb/etc/local.d:rw,noexec,nosuid,nodev,size=4m,uid=5984,gid=5984,mode=0700"
    volumes:
      - ${SCHOLARSERVER_DATA_LIVESYNC_COUCHDB}:/opt/couchdb/data
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime:ro
    expose: ["5984"]
    networks:
      instance:
        aliases: [livesync-couchdb, "obsidian-db-${SCHOLARSERVER_WORKSPACE_ID}-${SCHOLARSERVER_INSTANCE_ID}"]
    healthcheck:
      test: [CMD, /usr/local/bin/scholarserver-couchdb-healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18
  livesync-worker:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:7725158d64ae37da17e952c2335c3cf1354a564e6a754f70b7330dc31c083801
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_LIVESYNC_DB}:/livesync-db
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8081"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
