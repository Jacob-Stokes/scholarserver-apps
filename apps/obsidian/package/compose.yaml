services:
  sync:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:0230a479af0e782871e2b35be64fa9e168e7b1a0c5ce9d7d86972270abb1c537
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    environment:
      SCHOLARSERVER_WORKSPACE_ID: ${SCHOLARSERVER_WORKSPACE_ID}
      SCHOLARSERVER_INSTANCE_ID: ${SCHOLARSERVER_INSTANCE_ID}
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_VAULTS}:/vaults
      - ${SCHOLARSERVER_DATA_HEADLESS_CONFIG}:/home/obsidian/.config
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_OFFICIAL_CLIENT}:/official-client
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  api:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:ee8887c7c14cd9f5d8860ebde643a487014486f3130e5046593857dc1b85f7d6
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_VAULTS}:/vaults
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["3000"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:76510fb7024567e3faa012d6b3bb1ba2fedee16091c7a15c26eddfef3f925e4b
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["7002"]
    networks:
      instance:
        aliases: [obsidian-mcp]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7002/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  livesync-couchdb:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:49cb9ad1ca165133f6ed55cf221f13f3e530ca47c94fe8b8f9cd4830ec639db6
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
      - "/opt/couchdb/etc/local.d:rw,noexec,nosuid,nodev,size=4m,uid=5984,gid=5984,mode=0700"
    volumes:
      - ${SCHOLARSERVER_DATA_LIVESYNC_COUCHDB}:/opt/couchdb/data
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime:ro
    expose: ["5984"]
    networks:
      instance:
        aliases: [livesync-couchdb, "obsidian-db-${SCHOLARSERVER_WORKSPACE_ID}-${SCHOLARSERVER_INSTANCE_ID}"]
    healthcheck:
      test: [CMD, /usr/local/bin/scholarserver-couchdb-healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18
  livesync-worker:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:27b9ed38adf52be5874786d6bf7d966c02168d933be073dd506be744d8aacb99
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_VAULTS}:/vaults
      - ${SCHOLARSERVER_DATA_LIVESYNC_DB}:/livesync-db
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8081"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
