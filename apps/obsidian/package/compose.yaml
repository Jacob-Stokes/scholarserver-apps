services:
  sync:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:0b035c54e0ca2a7da7f552f12701a6027ca363fd6a64f090cc4226e87ef42fd2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
      SCHOLARSERVER_WORKSPACE_ID: ${SCHOLARSERVER_WORKSPACE_ID}
      SCHOLARSERVER_INSTANCE_ID: ${SCHOLARSERVER_INSTANCE_ID}
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_HEADLESS_CONFIG}:/home/obsidian/.config
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_OFFICIAL_CLIENT}:/official-client
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  api:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-api@sha256:12330a66d2437035343e1985fe3e6e6b138806905a67b7312b8716a22f39d619
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["3000"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-mcp@sha256:b4abae1329bd1f2de666fcc08733c701fe7eff17c88aa1ae0444d1cc1eb21290
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    expose: ["7002"]
    networks:
      instance:
        aliases: [obsidian-mcp]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7002/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  livesync-couchdb:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:6e25b3b43b9be946237d1aa9ab75fcef2df1f34c0c852f1185706145630a68cb
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
      - "/opt/couchdb/etc/local.d:rw,noexec,nosuid,nodev,size=4m,uid=5984,gid=5984,mode=0700"
    volumes:
      - ${SCHOLARSERVER_DATA_LIVESYNC_COUCHDB}:/opt/couchdb/data
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime:ro
    expose: ["5984"]
    networks:
      instance:
        aliases: [livesync-couchdb, "obsidian-db-${SCHOLARSERVER_WORKSPACE_ID}-${SCHOLARSERVER_INSTANCE_ID}"]
    healthcheck:
      test: [CMD, /usr/local/bin/scholarserver-couchdb-healthcheck]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18
  livesync-worker:
    image: ghcr.io/jacob-stokes/scholarserver-obsidian-sync@sha256:6b1378c3ee1f1f07d6db00dfb5d9539631ada77b5a2ecc45cd1e70e6f151e944
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    volumes:
      - ${SCHOLARSERVER_DATA_VAULT}:/vault
      - ${SCHOLARSERVER_DATA_LIVESYNC_DB}:/livesync-db
      - ${SCHOLARSERVER_DATA_LIVESYNC_RUNTIME}:/livesync-runtime
    expose: ["8081"]
    networks: [instance]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
