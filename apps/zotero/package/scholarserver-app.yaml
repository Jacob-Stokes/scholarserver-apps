schemaVersion: 1
id: org.scholarserver.zotero
name: Zotero
packageVersion: 0.3.1
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Zotero
  version: 10.0.1
  license: AGPL-3.0-or-later
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: remote-desktop
  management: managed
tenancy:
  mode: per-workspace
capabilities:
  provides: [references.zotero-library, attachments.resolve, mcp.zotero]
  requires: [gateway.mcp]
  conflicts: []
resources:
  minimum: { cpu: 1, memory: 2GiB, disk: 5GiB }
  recommended: { cpu: 2, memory: 4GiB, disk: 25GiB }
permissions:
  networkEgress: [sync.zotero.org, api.zotero.org, user-configured-webdav]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: desktop
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:1d90ec0b016bd2090d204f75f55dd5758e74f0d8f871f70be969ef19c3158dc6
  - service: controller
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:67fa99d1bf8f89cb64421111da64f7d1f99475740b21681e6ec655afaeb18db0
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:3856f59ff167879ac4bb214501566b927928bf82369bc36c5f60551971c71c3c
data:
  - id: desktop-config
    mountPath: /config
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: library
    mountPath: /data
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: application-consistent
    retention: preserve
    exportFormat: Zotero data directory
  - id: runtime
    mountPath: /runtime
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: reproducible
    retention: preserve
  - id: linked-files
    mountPath: /linked
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: plain-directory
    externalStorage:
      mountable: true
      access: read-write
      content: documents
endpoints:
  - id: desktop
    service: desktop
    port: 3000
    protocol: http
    exposure: human-optional
    auth: authentik-forward-single
  - id: app-ui
    service: desktop
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: mcp
    service: desktop
    port: 7012
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Zotero
      namespace: zotero
      hostname: desktop
      credentialData: runtime
      credentialFile: service-token
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /overview
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  rollback: backup-required
onboarding:
  readyWhen: compose-health
  checklist:
    - Connect a Zotero account in ScholarServer
    - Choose how attachments are stored and downloaded
    - Authorize ScholarServer for local library access
    - Run the first synchronization
  actions:
    - id: status
      data: runtime
      timeoutSeconds: 10
      fields: []
    - id: account-start
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: account-complete
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: configure-storage
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: storageMode, type: string, secret: false, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: configure-webdav
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: url, type: string, secret: false, required: true }
        - { id: username, type: string, secret: false, required: true }
        - { id: password, type: string, secret: true, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: authorize-local
      data: runtime
      timeoutSeconds: 300
      activateGateway: true
      fields: []
    - id: sync-now
      data: runtime
      timeoutSeconds: 900
      fields: []
    - id: resolve-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: attachmentKey, type: string, secret: false, required: true }
    - id: match-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: sourcePath, type: string, secret: false, required: true }
    - id: attach-docling-result
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: sourceAttachmentKey, type: string, secret: false, required: true }
        - { id: relativePath, type: string, secret: false, required: true }
