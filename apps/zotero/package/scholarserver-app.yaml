schemaVersion: 1
id: org.scholarserver.zotero
name: Zotero
packageVersion: 0.5.12-manager.20260929.1
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Zotero
  version: 10.0.1
  license: AGPL-3.0-or-later
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: remote-desktop
  management: managed
tenancy:
  mode: per-workspace
capabilities:
  provides: [references.zotero-library, attachments.resolve, mcp.zotero, automations.zotero]
  requires: [gateway.mcp]
  conflicts: []
variants:
  - id: complete-workspace
    name: Complete Zotero workspace
    description: Run Zotero privately on this server, with its browser desktop, plugins, attachment choices, AI tools, and optional automations.
    recommended: true
    services: [desktop, local-api-bridge, controller, automations, mcp]
    data: [desktop-config, library, runtime, linked-files, automation-state, cloud-cache]
    resources:
      minimum: { cpu: 1, memory: 2GiB, disk: 5GiB }
      recommended: { cpu: 2, memory: 4GiB, disk: 25GiB }
    highlights:
      - Full Zotero desktop available privately in your browser
      - Supports Zotero Storage, WebDAV, and shared linked folders
      - Includes AI access and optional PDF-processing automations
    limitations: []
  - id: online-library
    name: Online library only
    description: Connect ScholarServer directly to your zotero.org library without running Zotero Desktop on this server.
    recommended: false
    services: [controller, mcp]
    data: [library, runtime, linked-files, cloud-cache]
    resources:
      minimum: { cpu: 0.25, memory: 256MiB, disk: 1GiB }
      recommended: { cpu: 0.5, memory: 512MiB, disk: 5GiB }
    highlights:
      - Uses substantially fewer server resources
      - Gives approved AI tools access to citations, collections, tags, and notes
      - Can fetch Zotero Storage attachments when needed
    limitations:
      - Browser-based Zotero desktop or desktop plugins
      - WebDAV and linked-file contents are not available through the Zotero Web API
      - Server-side attachment automations require files stored in Zotero Storage
resources:
  minimum: { cpu: 1, memory: 2GiB, disk: 5GiB }
  recommended: { cpu: 2, memory: 4GiB, disk: 25GiB }
permissions:
  networkEgress: [sync.zotero.org, api.zotero.org, user-configured-webdav]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: desktop
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:5a6ba6855e59cb40c4e10a9ebb6bb85dc8843283154a87edfdb4894ed68fdf7c
  - service: controller
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:d0c54ba4f2013fdf8bf60ac1eff0d9bc9afae8cc4dd4e89a49f385bf07e50951
  - service: local-api-bridge
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-local-api-bridge@sha256:3f73624c510977bb8cd204236818168cb69dd75d54f4409e90b7679090995730
  - service: automations
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-automations@sha256:bdb354489093595f2d13d9eacb4043496de40eca6b54126818d21bc36afa288d
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:3d413933e62fdd44707e94068a7113fe4394e935758e7d03999372866bbdb410
data:
  - id: desktop-config
    mountPath: /config
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: library
    mountPath: /data
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: application-consistent
    retention: preserve
    exportFormat: Zotero data directory
  - id: runtime
    mountPath: /runtime
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: reproducible
    retention: preserve
  - id: linked-files
    mountPath: /linked
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: plain-directory
    externalStorage:
      mountable: true
      access: read-write
      content: documents
  - id: automation-state
    mountPath: /state
    owner: zotero-automations
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: cloud-cache
    mountPath: /cache
    owner: zotero-controller
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: reproducible
    retention: preserve
endpoints:
  - id: desktop
    service: desktop
    port: 3000
    protocol: http
    exposure: human-optional
    auth: authentik-forward-single
    remoteAccess:
      private: true
      public: true
      authentik: optional
      defaultAuthentik: true
    public:
      defaultSubdomain: zotero
      audience: authenticated
  - id: app-ui
    service: controller
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: mcp
    service: mcp
    port: 7012
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Zotero
      namespace: zotero
      hostname: zotero-mcp
      credentialData: runtime
      credentialFile: service-token
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /overview
  configurationPath: /configuration
  configuration:
    version: 1
    sections:
      - { id: setup, title: Library connection }
      - { id: automation, title: PDF processing }
presentation:
  editorialIcon:
    path: assets/icons/zotero-editorial.png
    mediaType: image/png
    attribution:
      name: ScholarServer editorial marks
      url: https://github.com/Jacob-Stokes/scholarserver-apps
      license: CC-BY-4.0
      licenseUrl: https://creativecommons.org/licenses/by/4.0/
  details:
    description: Organise your references and research papers.
    tags: [References, Notes, Documents, Files]
    links:
      - { label: Zotero account sign-in, kind: website, url: https://www.zotero.org/login }
  icon:
    path: assets/icons/zotero.webp
    mediaType: image/webp
    attribution:
      name: selfh.st/icons
      url: https://selfh.st/icons/
      license: CC-BY-4.0
      licenseUrl: https://github.com/selfhst/icons/blob/main/LICENSE
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  rollback: backup-required
onboarding:
  readyWhen: compose-health
  checklist:
    - Connect a Zotero account
    - Choose how ScholarServer may access attachments
    - Complete desktop authorization when using the complete workspace
    - Configure optional automations after setup
  actions:
    - id: research-items
      data: runtime
      timeoutSeconds: 120
      fields:
        - { id: since, type: string, secret: false, required: true }
        - { id: until, type: string, secret: false, required: true }
    - id: status
      data: runtime
      timeoutSeconds: 10
      fields: []
    - id: account-start
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: account-complete
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: connect-online-library
      data: runtime
      timeoutSeconds: 30
      activateGateway: true
      fields:
        - { id: apiKey, type: string, secret: true, required: true }
    - id: configure-storage
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: storageMode, type: string, secret: false, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: configure-webdav
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: url, type: string, secret: false, required: true }
        - { id: username, type: string, secret: false, required: true }
        - { id: password, type: string, secret: true, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: authorize-local
      data: runtime
      timeoutSeconds: 300
      activateGateway: true
      fields: []
    - id: sync-now
      data: runtime
      timeoutSeconds: 900
      fields: []
    - id: resolve-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: attachmentKey, type: string, secret: false, required: true }
    - id: match-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: sourcePath, type: string, secret: false, required: true }
    - id: attach-docling-result
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: sourceAttachmentKey, type: string, secret: false, required: true }
        - { id: relativePath, type: string, secret: false, required: true }
