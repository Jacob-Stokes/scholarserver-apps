schemaVersion: 1
id: org.scholarserver.zotero
name: Zotero
packageVersion: 0.4.7
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Zotero
  version: 10.0.1
  license: AGPL-3.0-or-later
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: remote-desktop
  management: managed
tenancy:
  mode: per-workspace
capabilities:
  provides: [references.zotero-library, attachments.resolve, mcp.zotero, automations.zotero]
  requires: [gateway.mcp]
  conflicts: []
variants:
  - id: research-workflow
    name: Research workflow
    description: The complete Zotero setup, including the worker that runs ScholarServer automations.
    recommended: true
    services: [desktop, controller, automations, mcp]
    data: [desktop-config, library, runtime, linked-files, automation-state]
    resources:
      minimum: { cpu: 1, memory: 2GiB, disk: 5GiB }
      recommended: { cpu: 2, memory: 4GiB, disk: 25GiB }
    highlights:
      - Includes citation and attachment access for approved AI tools
      - Includes Zotero automations such as PDF processing workflows
      - Includes the private browser-based Zotero desktop
    limitations: []
  - id: core-library
    name: Core library
    description: Zotero library, attachment access, browser desktop and AI tools without the automation worker.
    recommended: false
    services: [desktop, controller, mcp]
    data: [desktop-config, library, runtime, linked-files]
    resources:
      minimum: { cpu: 0.75, memory: 1536MiB, disk: 5GiB }
      recommended: { cpu: 1.5, memory: 3GiB, disk: 25GiB }
    highlights:
      - Keeps Zotero and its AI tools available
      - Uses fewer background resources
      - Retains the private browser-based Zotero desktop
    limitations:
      - Does not run Zotero automation jobs
resources:
  minimum: { cpu: 1, memory: 2GiB, disk: 5GiB }
  recommended: { cpu: 2, memory: 4GiB, disk: 25GiB }
permissions:
  networkEgress: [sync.zotero.org, api.zotero.org, user-configured-webdav]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: desktop
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:533819e5acd707a99d3a103ca91992cb8c3fe2db22cb85fba2906ee2f40d6cfe
  - service: controller
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:813e01b217b77a6ddb017cdd9a4127a90b7ed384302455843b973577f5e09461
  - service: automations
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-automations@sha256:51054dc1397e466f3ab303ec238ed0bcf81bf1082848b25322c2e60fdc472174
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:3856f59ff167879ac4bb214501566b927928bf82369bc36c5f60551971c71c3c
data:
  - id: desktop-config
    mountPath: /config
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: library
    mountPath: /data
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: application-consistent
    retention: preserve
    exportFormat: Zotero data directory
  - id: runtime
    mountPath: /runtime
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: reproducible
    retention: preserve
  - id: linked-files
    mountPath: /linked
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: plain-directory
    externalStorage:
      mountable: true
      access: read-write
      content: documents
  - id: automation-state
    mountPath: /state
    owner: zotero-automations
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
endpoints:
  - id: desktop
    service: desktop
    port: 3000
    protocol: http
    exposure: human-optional
    auth: authentik-forward-single
  - id: app-ui
    service: desktop
    port: 8080
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: mcp
    service: desktop
    port: 7012
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Zotero
      namespace: zotero
      hostname: desktop
      credentialData: runtime
      credentialFile: service-token
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /overview
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  rollback: backup-required
onboarding:
  readyWhen: compose-health
  checklist:
    - Connect a Zotero account in ScholarServer
    - Choose how attachments are stored and downloaded
    - Authorize ScholarServer for local library access
    - Run the first synchronization
    - Configure optional Zotero automations
  actions:
    - id: status
      data: runtime
      timeoutSeconds: 10
      fields: []
    - id: account-start
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: account-complete
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: configure-storage
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: storageMode, type: string, secret: false, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: configure-webdav
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: url, type: string, secret: false, required: true }
        - { id: username, type: string, secret: false, required: true }
        - { id: password, type: string, secret: true, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: authorize-local
      data: runtime
      timeoutSeconds: 300
      activateGateway: true
      fields: []
    - id: sync-now
      data: runtime
      timeoutSeconds: 900
      fields: []
    - id: resolve-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: attachmentKey, type: string, secret: false, required: true }
    - id: match-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: sourcePath, type: string, secret: false, required: true }
    - id: attach-docling-result
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: sourceAttachmentKey, type: string, secret: false, required: true }
        - { id: relativePath, type: string, secret: false, required: true }
