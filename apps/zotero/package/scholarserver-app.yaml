schemaVersion: 1
id: org.scholarserver.zotero
name: Zotero
packageVersion: 0.2.1
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Zotero
  version: 10.0.1
  license: AGPL-3.0-or-later
support:
  tier: official
  architectures: [amd64, arm64]
delivery:
  class: remote-desktop
  management: managed
tenancy:
  mode: per-workspace
capabilities:
  provides: [references.zotero-library, attachments.resolve, mcp.zotero]
  requires: [gateway.mcp]
  conflicts: []
resources:
  minimum: { cpu: 1, memory: 2GiB, disk: 5GiB }
  recommended: { cpu: 2, memory: 4GiB, disk: 25GiB }
permissions:
  networkEgress: [sync.zotero.org, api.zotero.org, user-configured-webdav]
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities: [ALL]
images:
  - service: desktop
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:af1cc11418b0febf9fa9c55193009fa79e638726fa23331a2fbb97e21fdeadf6
  - service: controller
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:13504bff167672aa77a153d819ae6931e76e5ad9581f8a93d4e99e662fd2399b
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:c8320427018f2cb9cbd4cf7944e26c3f5a47c7c775630f590a7ea4fa24964aa7
data:
  - id: desktop-config
    mountPath: /config
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: filesystem-consistent
    retention: preserve
  - id: library
    mountPath: /data
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: application-consistent
    retention: preserve
    exportFormat: Zotero data directory
  - id: runtime
    mountPath: /runtime
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0700" }
    backup: reproducible
    retention: preserve
  - id: linked-files
    mountPath: /linked
    owner: zotero
    filesystem: { uid: 10001, gid: 10001, mode: "0750" }
    backup: filesystem-consistent
    retention: preserve
    exportFormat: plain-directory
endpoints:
  - id: desktop
    service: desktop
    port: 3000
    protocol: http
    exposure: human-optional
    auth: authentik-forward-single
  - id: mcp
    service: desktop
    port: 7012
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Zotero
      namespace: zotero
      hostname: desktop
      credentialData: runtime
      credentialFile: service-token
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  rollback: backup-required
onboarding:
  readyWhen: compose-health
  checklist:
    - Connect a Zotero account in ScholarServer
    - Choose how attachments are stored and downloaded
    - Authorize ScholarServer for local library access
    - Run the first synchronization
  actions:
    - id: status
      data: runtime
      timeoutSeconds: 10
      fields: []
    - id: account-start
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: account-complete
      data: runtime
      timeoutSeconds: 30
      fields: []
    - id: configure-storage
      data: runtime
      timeoutSeconds: 30
      fields:
        - { id: storageMode, type: string, secret: false, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: configure-webdav
      data: runtime
      timeoutSeconds: 180
      fields:
        - { id: url, type: string, secret: false, required: true }
        - { id: username, type: string, secret: false, required: true }
        - { id: password, type: string, secret: true, required: true }
        - { id: downloadMode, type: string, secret: false, required: true }
        - { id: groupFileSync, type: boolean, secret: false, required: true }
    - id: authorize-local
      data: runtime
      timeoutSeconds: 300
      activateGateway: true
      fields: []
    - id: sync-now
      data: runtime
      timeoutSeconds: 900
      fields: []
    - id: resolve-attachment
      data: runtime
      timeoutSeconds: 60
      fields:
        - { id: attachmentKey, type: string, secret: false, required: true }
