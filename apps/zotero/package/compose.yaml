services:
  desktop:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:6b062ae18c2df722ee626b8b2ac983e0a78b371fb192a8e4ff187d85ca2daa8f
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
      - "/run:rw,nosuid,nodev,size=32m,mode=0755"
    volumes:
      - ${SCHOLARSERVER_DATA_DESKTOP_CONFIG}:/config
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked
    expose: ["3000"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:23119/connector/ping]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 18
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:9f6f4be3e13f7817de0dd0fe604f54b37ce430f886bdeb1a6c4e25c6540cdaaf
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
      - ${SCHOLARSERVER_DATA_CLOUD_CACHE}:/cache
    expose: ["8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  local-api-bridge:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-local-api-bridge@sha256:64ffcc36b8d85ec7b3b749d52dd8eebdbde3a24c7e93af37aea8aad9b254f92c
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8082/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  automations:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-automations@sha256:22146610b6a0fe77112b9191ec92f9cfa48a303a6fa658a8abb892b04b812e81
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    environment:
      SCHOLARSERVER_INSTANCE_ID: ${SCHOLARSERVER_INSTANCE_ID}
      SCHOLARSERVER_WORKSPACE_ID: ${SCHOLARSERVER_WORKSPACE_ID}
    volumes:
      - ${SCHOLARSERVER_DATA_AUTOMATION_STATE}:/state
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    networks: [instance, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:e2154603f5481575bc47a1afdb2cf6473e805e20e84553d42bd2bdbca06e3fc0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    expose: ["7012"]
    networks:
      instance:
        aliases: [zotero-mcp]
      egress: {}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7012/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
