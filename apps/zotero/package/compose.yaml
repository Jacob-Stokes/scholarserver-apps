services:
  desktop:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:533819e5acd707a99d3a103ca91992cb8c3fe2db22cb85fba2906ee2f40d6cfe
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
      - "/run:rw,nosuid,nodev,size=32m,mode=0755"
    volumes:
      - ${SCHOLARSERVER_DATA_DESKTOP_CONFIG}:/config
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked
    expose: ["3000", "7012", "8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:23119/connector/ping]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 18
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:813e01b217b77a6ddb017cdd9a4127a90b7ed384302455843b973577f5e09461
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  automations:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-automations@sha256:51054dc1397e466f3ab303ec238ed0bcf81bf1082848b25322c2e60fdc472174
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    environment:
      SCHOLARSERVER_INSTANCE_ID: ${SCHOLARSERVER_INSTANCE_ID}
      SCHOLARSERVER_WORKSPACE_ID: ${SCHOLARSERVER_WORKSPACE_ID}
    volumes:
      - ${SCHOLARSERVER_DATA_AUTOMATION_STATE}:/state
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    networks: [instance, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:3856f59ff167879ac4bb214501566b927928bf82369bc36c5f60551971c71c3c
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7012/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
