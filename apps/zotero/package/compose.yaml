services:
  desktop:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:11b9d406d0411188a1a0c7c92d7cbb605e9d17a1d048b4a06de58dfb8629049a
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
      - "/run:rw,nosuid,nodev,size=32m,mode=0755"
    volumes:
      - ${SCHOLARSERVER_DATA_DESKTOP_CONFIG}:/config
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked
    expose: ["3000", "7012"]
    networks: [instance, egress]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:23119/connector/ping]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 18
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:19ef933d62e8a88049062dbe9be1524e7bfc5b7b61b582c72438a0beb7b2a617
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').statSync('/runtime/status.json')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:f94897dd23955c085fc00f25a44bd1d612f321db69ea174f394e46f3fc602d5c
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7012/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
