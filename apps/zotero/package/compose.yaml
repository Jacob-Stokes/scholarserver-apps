services:
  desktop:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:1d90ec0b016bd2090d204f75f55dd5758e74f0d8f871f70be969ef19c3158dc6
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
      - "/run:rw,nosuid,nodev,size=32m,mode=0755"
    volumes:
      - ${SCHOLARSERVER_DATA_DESKTOP_CONFIG}:/config
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked
    expose: ["3000", "7012"]
    networks: [instance, egress]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:23119/connector/ping]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 18
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:e9ee06eb938d99b1709a885c989ff0f6a2bf702c70f1c6805169dfe810ed9d6f
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').statSync('/runtime/status.json')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:3856f59ff167879ac4bb214501566b927928bf82369bc36c5f60551971c71c3c
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:desktop
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7012/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
