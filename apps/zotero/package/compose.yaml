services:
  desktop:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-desktop@sha256:5541788986bc4bd429daa3232d0a603e7d086d306770188c69ab727b59d9c5c0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=256m,mode=1777"
      - "/run:rw,nosuid,nodev,size=32m,mode=0755"
    volumes:
      - ${SCHOLARSERVER_DATA_DESKTOP_CONFIG}:/config
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked
    expose: ["3000"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:23119/connector/ping]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 18
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-controller@sha256:cf001f388e81486e8f8a9d87637f99195290d3467569ff5d5f85c574d281f9c2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
      - ${SCHOLARSERVER_DATA_CLOUD_CACHE}:/cache
    expose: ["8080"]
    networks: [instance, egress, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  automations:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-automations@sha256:b337562871b94b3d5193e5467d8d6c7fc5110410a5c0e46c1dc3d78415ac7492
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    environment:
      SCHOLARSERVER_INSTANCE_ID: ${SCHOLARSERVER_INSTANCE_ID}
      SCHOLARSERVER_WORKSPACE_ID: ${SCHOLARSERVER_WORKSPACE_ID}
    volumes:
      - ${SCHOLARSERVER_DATA_AUTOMATION_STATE}:/state
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    networks: [instance, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
  mcp:
    image: ghcr.io/jacob-stokes/scholarserver-zotero-mcp@sha256:ee2dc050092ecc32c9d92ab8f0daefea72468b93ae6f8fcb2db89d8782d6f982
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      SCHOLARSERVER_VARIANT: ${SCHOLARSERVER_VARIANT}
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime:ro
      - ${SCHOLARSERVER_DATA_LIBRARY}:/data:ro
      - ${SCHOLARSERVER_DATA_LINKED_FILES}:/linked:ro
    expose: ["7012"]
    networks: [instance, egress]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:7012/health]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
