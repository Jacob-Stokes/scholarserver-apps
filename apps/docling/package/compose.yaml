services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:32ba1a1dded8d8fd21f9d8da1b9837e04cfee164ef891d9513174c3d989dcee9
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1001:0"
    cpus: 1
    mem_limit: 4g
    pids_limit: 256
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777"
    expose: ["5001"]
    networks: [instance, egress]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:5001/health]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-docling-app@sha256:f4fded0228ef849ef2494f906393a16e9dc153d8967a7656d539b52af8ee430e
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 384m
    pids_limit: 64
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_DOCUMENTS}:/documents
    expose: ["8080"]
    networks: [instance, edge]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
