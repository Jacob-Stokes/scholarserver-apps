services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu@sha256:32ba1a1dded8d8fd21f9d8da1b9837e04cfee164ef891d9513174c3d989dcee9
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "1001:0"
    cpus: 1
    mem_limit: 4g
    pids_limit: 256
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777"
    expose: ["5001"]
    networks: [instance, egress]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:5001/health]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 20
  controller:
    image: ghcr.io/jacob-stokes/scholarserver-docling-app@sha256:950265066352d627c86397b34ecc1b6bf50daf448d53ce0d6dfbd802dcbf4950
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 384m
    pids_limit: 64
    volumes:
      - ${SCHOLARSERVER_DATA_RUNTIME}:/runtime
      - ${SCHOLARSERVER_DATA_DOCUMENTS}:/documents
    expose: ["8080"]
    networks: [instance, edge]
    healthcheck:
      # Avoid urllib's cold import cost under this controller's small CPU limit.
      test: [CMD, python3, -c, "import socket,sys; c=socket.create_connection(('127.0.0.1',8080),2); c.sendall(b'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n'); sys.exit(c.makefile('rb').readline(512).split()[1] != b'200')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
networks:
  instance:
    name: ${SCHOLARSERVER_INSTANCE_NETWORK}
    internal: true
  egress:
    name: ${SCHOLARSERVER_EGRESS_NETWORK}
    internal: false
  edge:
    name: scholarserver-edge
    external: true
