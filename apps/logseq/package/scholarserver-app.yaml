schemaVersion: 1
id: org.scholarserver.logseq
name: Logseq (Beta)
presentation:
  editorialIcon:
    path: assets/icons/logseq-editorial.png
    mediaType: image/png
    attribution:
      name: ScholarServer editorial marks
      url: https://github.com/Jacob-Stokes/scholarserver-apps
      license: CC-BY-4.0
      licenseUrl: https://creativecommons.org/licenses/by/4.0/
  details:
    description: An outliner for connected notes and knowledge.
    tags: [Notes]
    links:
      - { label: Logseq account sign-in, kind: website, url: https://logseq-prod.auth.us-east-1.amazoncognito.com/oauth2/authorize }
  icon:
    path: assets/icons/logseq.webp
    mediaType: image/webp
    attribution:
      name: selfh.st/icons
      url: https://selfh.st/icons/
      license: CC-BY-4.0
      licenseUrl: https://github.com/selfhst/icons/blob/main/LICENSE
packageVersion: 0.1.2-manager.20260929.2
compatibility:
  platform: ">=0.1.0"
  schema: 1
upstream:
  name: Logseq database graphs
  version: 2.0.1
  license: AGPL-3.0
support:
  tier: official
  architectures:
    - amd64
    - arm64
delivery:
  class: headless-service
  management: managed
tenancy:
  mode: per-workspace
capabilities:
  provides:
    - notes.graph
    - notes.sync
    - mcp.logseq
  requires:
    - gateway.mcp
  conflicts: []
variants:
  - id: browser
    name: With browser editor
    description: "Beta: Logseq 2 database notebooks with a private browser editor,
      encrypted sync and AI tools."
    recommended: true
    services:
      - helper
      - mcp
      - sync
      - editor
    data:
      - graph
      - runtime
      - sync
      - sync-config
    resources: &a1
      minimum:
        cpu: 1
        memory: 2GiB
        disk: 2GiB
      recommended:
        cpu: 2
        memory: 3GiB
        disk: 10GiB
    highlights:
      - Private browser editing
      - Encrypted sync and AI tools
    limitations:
      - "Beta: use a disposable notebook first"
      - Logseq 2 database graphs only; not legacy Markdown graphs
      - Requires Tailscale and a Logseq account
      - Physical-device and public AI sign-in acceptance remain incomplete
  - id: devices
    name: Devices only
    description: Use Logseq on your own devices, with a synced server copy for AI tools.
    recommended: false
    services:
      - helper
      - mcp
      - sync
    data:
      - graph
      - runtime
      - sync
      - sync-config
    resources: *a1
    highlights:
      - Encrypted sync and AI tools
    limitations:
      - "Beta: use a disposable notebook first"
      - No browser editor
      - Logseq 2 database graphs only
      - Requires a Logseq account and Tailscale
resources: *a1
permissions:
  networkEgress:
    - logseq-account
  hostMounts: []
  devices: []
hardening:
  readOnlyRoot: true
  noNewPrivileges: true
  dropCapabilities:
    - ALL
images:
  - service: helper
    reference: ghcr.io/jacob-stokes/scholarserver-logseq-helper@sha256:2dd4b0e3885d20bf14e83434223983cb86a44f68cc35e8d2540e90cb5307f382
  - service: mcp
    reference: ghcr.io/jacob-stokes/scholarserver-logseq-mcp@sha256:b2724770d068530be2b38b013774eee6245f0c74def6c53891f81c332fff208d
  - service: sync
    reference: ghcr.io/jacob-stokes/scholarserver-logseq-sync@sha256:138a19cb6bff814d88e118ff49c219925860dcb8cbdebe76b686ca580b9e5840
  - service: editor
    reference: ghcr.io/yshalsager/logseq-selfhost-web@sha256:46d425b4eafdf5552b22ecefb58ed37d547460f47bec7f25ab77f75520ac4a1d
data:
  - id: graph
    mountPath: /home/node/logseq
    backup: filesystem-consistent
    owner: logseq
    filesystem:
      uid: 1000
      gid: 1000
      mode: "0700"
    retention: preserve
  - id: runtime
    mountPath: /runtime
    backup: reproducible
    owner: logseq
    filesystem:
      uid: 1000
      gid: 1000
      mode: "0700"
    retention: preserve
  - id: sync
    mountPath: /app/data
    backup: filesystem-consistent
    owner: logseq
    filesystem:
      uid: 65532
      gid: 65532
      mode: "0700"
    retention: preserve
  - id: sync-config
    mountPath: /sync-config
    backup: reproducible
    owner: logseq
    filesystem:
      uid: 1000
      gid: 1000
      mode: "0755"
    retention: preserve
endpoints:
  - id: app-ui
    service: helper
    port: 8081
    protocol: http
    exposure: human-optional
    auth: platform-session
  - id: sync
    service: sync
    port: 8787
    protocol: http
    exposure: human-optional
    auth: native-oidc
    remoteAccess: &a2
      routing: origin
      private: true
      public: false
      authentik: unsupported
      defaultAuthentik: false
  - id: editor
    service: editor
    port: 8080
    protocol: http
    exposure: human-optional
    auth: none-private
    remoteAccess: *a2
  - id: mcp
    service: mcp
    port: 7013
    protocol: http
    exposure: gateway
    auth: service-identity
    gateway:
      displayName: Logseq
      namespace: logseq
      hostname: logseq-mcp
      credentialData: runtime
      credentialFile: service-token
ui:
  mode: standalone
  endpoint: app-ui
  defaultPath: /configuration
  configurationPath: /configuration
  configuration:
    version: 1
    sections:
      - { id: setup, title: Notebook connection }
lifecycle:
  supportsDisable: true
  removeDataDefault: false
  rollback: backup-required
onboarding:
  readyWhen: compose-health
  checklist:
    - Set up the private connection
    - Connect your Logseq account
    - Choose an encrypted notebook
    - Enable the AI connection
