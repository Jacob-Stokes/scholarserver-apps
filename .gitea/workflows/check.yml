name: Application source and production builds

on:
  push:
    branches: [main, codex/beginner-acceptance]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

jobs:
  check:
    runs-on: resolution-amd64
    timeout-minutes: 90
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Locked source checks and application builds
        run: sh scripts/check-source.sh
